name: Test creating release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Dummy release
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy file
        run: echo Hello World :D > dummy.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dummy
          files: dummy.txt