name: GUI build
on:
  push:
    tags:
      - 'gui-v*'
      - '!gui-v*-SNAPSHOT'
permissions:
  contents: write
jobs:
  build-gui-jar:
    name: Build JAR for marquee-gui
    runs-on: ubuntu-latest
    env:
      JAR_NAME: "marquee-${{ github.ref_name }}"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew :marquee-gui:shadowJar -PjarName="${{ JAR_NAME }}"
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: ${{ JAR_NAME }}-all
          path: marquee-gui/build/libs/${{ JAR_NAME }}-all.jar
  check-jar:
    name: Test run the JAR
    needs: [build-gui-jar]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm, macos-26, macos-26-intel, ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: ./
          name: ${{ JAR_NAME }}-all
      - name: Run the JAR on ${{ matrix.os }}
        timeout-minutes: 1
        continue-on-error: true
        run: java -jar ${{ JAR_NAME }}-all.jar
  publish:
    name: Publish the built binaries
    needs: [build-gui-jar]
    runs-on: ubuntu-slim
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: marquee-gui/releases
          pattern: ${{ JAR_NAME }}-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: marquee-gui/releases/*
          draft: true
