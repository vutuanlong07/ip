name: Build binaries for marquee-cli
on:
  push:
    tags:
      - 'cli-v*'
      - '!cli-v*-SNAPSHOT'
permissions:
  contents: write
jobs:
  build-cli:
    name: Build binaries for marquee-cli on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew :marquee-cli:nativeCompile
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: marquee-${{ github.ref_name }}-${{ matrix.os }}
          path: marquee-cli/build/native/nativeCompile/*
  build-cli-jar:
    name: Build JAR for marquee-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew :marquee-cli:jar
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: marquee-${{ github.ref_name }}-jar
          path: marquee-cli/build/libs/*
  publish:
    name: Publish the built binaries
    needs: [build-cli, build-cli-jar]
    runs-on: ubuntu-slim
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: marquee-cli/releases
          pattern: marquee-${{ github.ref_name }}-*
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: marquee-cli/releases/*
          draft: true
